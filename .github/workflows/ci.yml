name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 rather than the 3.14 on the dev machine: the google-cloud-*
          # client libraries and their transitive deps lag new releases, and a
          # template should build on the version consumers can actually deploy.
          # Add a matrix here once the dependency set is pinned.
          python-version: '3.12'

      - name: Install dependencies
        # [gcp] is installed here so the concrete Pub/Sub publisher's tests run
        # rather than skip. The suite still needs no credentials — those tests
        # drive an injected fake client. A developer who omits the extra gets a
        # green run with those tests skipped.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gcp]"

      - name: Assert the stdlib is not shadowed
        # `futures` on PyPI is a Python 2 backport that installs a top-level
        # `concurrent/` package over the stdlib one. Fail loudly if it returns.
        run: |
          python - <<'PY'
          import concurrent.futures, pathlib, sysconfig
          stdlib = pathlib.Path(sysconfig.get_paths()["stdlib"]).resolve()
          actual = pathlib.Path(concurrent.futures.__file__).resolve()
          assert stdlib in actual.parents, f"concurrent.futures shadowed by {actual}"
          print(f"ok: {actual}")
          PY

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q
