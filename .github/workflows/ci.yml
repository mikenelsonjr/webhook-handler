name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 rather than the 3.14 on the dev machine: the google-cloud-*
          # client libraries and their transitive deps lag new releases, and a
          # template should build on the version consumers can actually deploy.
          # Add a matrix here once the dependency set is pinned.
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          elif [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "::warning::No dependency manifest yet — installing bare toolchain."
            pip install pytest ruff
          fi

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          set +e
          python -m pytest -q
          code=$?
          set -e
          # pytest exit 5 == "no tests collected". Tolerated only while this
          # accelerator is greenfield. DELETE this branch with the first test.
          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests collected. Remove this allowance in .github/workflows/ci.yml once tests exist."
            exit 0
          fi
          exit "$code"
